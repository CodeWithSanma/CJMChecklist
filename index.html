<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>CJM Auto Care – 220-Point PDI Checklist</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Michroma&display=swap" rel="stylesheet">
<style>
@font-face {
    font-family: 'Ethnocentric';
    src: url('./fonts/ethnocentric%20rg.ttf') format('truetype');
    font-weight: normal;
    font-style: normal;
    font-display: swap;
}
:root{--navy:#12263f;--acc:#e8590c;--ok:#2f9e44;--at:#f08c00;--df:#e03131;--na:#868e96;--ln:#e3e7ec;--bg:#f2f4f7;--mut:#5f6b7a;--red:#ed1c24}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#1c2430;font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.bar{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff;display:flex;gap:12px;align-items:center;padding:10px 16px;flex-wrap:wrap}
.bar b {
    font-family: 'Ethnocentric', sans-serif;
    font-weight: normal;
}.prog{flex:1;min-width:140px}.prog small{display:block;font-size:12px;opacity:.8}.prog div{height:6px;background:#ffffff30;border-radius:9px;overflow:hidden;margin-top:3px}.prog i{display:block;height:100%;width:0;background:var(--acc);transition:width .3s}
.btn{border:0;border-radius:8px;padding:9px 16px;font-weight:600;cursor:pointer;background:var(--acc);color:#fff;font-size:14px}.btn.g{background:#ffffff22}.btn:disabled{opacity:.6}
#sheet{max-width:980px;margin:18px auto;background:#fff;border-radius:14px;box-shadow:0 6px 28px #12263f1a;overflow:hidden}
.hero{background:linear-gradient(120deg,var(--navy),#1d4468);color:#fff;padding:22px 22px 18px}.hero{display:flex;align-items:center;gap:22px;flex-wrap:wrap}.logo{height:96px;width:auto;display:block}
.hero h1{margin:0;font-family: 'Ethnocentric', sans-serif;font-weight: normal;}
.hero h1 span{color:var(--red)}
.hinfo{flex:1;min-width:260px}
.brand{display:inline-block;max-width:100%}
.trust{font-family:'Ethnocentric',sans-serif;font-weight:normal;font-size:13px;margin:0 0 4px 64%;white-space:nowrap}
.addr,.tel{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-weight:700;color:#fff}
.addr{font-size:15px;margin-top:10px;line-height:1.4}
.tel{font-size:15px;margin-top:6px;letter-spacing:.04em}
.hero p{margin:10px 0 0;opacity:.85;font-size:13px}
.pad{padding:18px 22px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
label.f{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);font-weight:600}
input,textarea{width:100%;font:inherit;border:1px solid #cdd4dc;border-radius:8px;padding:8px 10px;background:#fff;margin-top:3px}input:focus,textarea:focus{outline:2px solid #ffa94d;border-color:var(--acc)}
.key{display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:#f7f9fb;border:1px solid var(--ln);border-radius:10px;padding:10px 14px;font-size:13px}.key span.o{pointer-events:none}.safe{font-size:12px;color:var(--mut);margin:10px 0 0}
.sec h2{margin:0;background:var(--navy);color:#fff;font-size:15px;padding:11px 22px;display:flex;gap:12px;align-items:center;break-after:avoid}.sec h2 b{background:var(--acc);border-radius:7px;min-width:28px;text-align:center;padding:2px 0}
.colh,.row{display:grid;grid-template-columns:34px 1fr 238px minmax(160px,.9fr);gap:8px;align-items:center;padding:7px 22px}.colh{font-size:11px;text-transform:uppercase;color:var(--mut);background:#f1f4f8;font-weight:600}
.row{border-bottom:1px solid #eef0f3}.row:nth-child(even){background:#fafbfd}.row>i{font-style:normal;color:var(--mut);font-weight:600}.row .obs{margin:0;padding:6px 8px;font-size:13px}
.opts{display:flex;gap:4px;align-items:center}.o{border:1px solid #cdd4dc;background:#fff;border-radius:7px;min-width:40px;height:32px;font-weight:700;color:#8b95a3;cursor:pointer;font-size:12px;padding:0 6px}.o.ok.sel{background:var(--ok);border-color:var(--ok);color:#fff}.o.at.sel{background:var(--at);border-color:var(--at);color:#fff}.o.df.sel{background:var(--df);border-color:var(--df);color:#fff}.o.na.sel,.yn .o.sel{background:var(--navy);border-color:var(--navy);color:#fff}
/* camera */
.cam{display:inline-flex;align-items:center;justify-content:center;width:40px;height:34px;border:1px solid #cdd4dc;border-radius:7px;background:#fff;color:var(--navy);cursor:pointer;flex:none;margin-left:2px}
.cam:hover,.cam:active{background:#fff4e6;border-color:var(--acc);color:var(--acc)}
.cam{padding:0;font:inherit}.cam svg{width:18px;height:18px}.cam input{display:none}
.choose-modal[hidden]{display:none!important}.choose-modal{position:fixed;top:0;left:0;right:0;bottom:0;z-index:1000;background:#071629d9;display:grid;place-items:center;padding:16px}.choose-box{width:min(320px,100%);background:#fff;border-radius:14px;padding:16px;display:grid;gap:10px}.choose-box h3{margin:0;font-size:15px;color:var(--navy)}.choose-box .btn{padding:14px 16px;font-size:16px;text-align:center;display:block;cursor:pointer;-webkit-tap-highlight-color:transparent}.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}.choose-box .btn.alt{background:var(--navy)}.choose-box .btn.cancel{background:#e9edf2;color:#344052}
.th{display:flex;gap:6px;flex-wrap:wrap}.th:not(:empty){margin-top:6px}
.ph{position:relative;display:inline-block}.ph img{height:56px;width:auto;border-radius:6px;border:1px solid #cdd4dc;display:block}
.ph .x{position:absolute;top:-6px;right:-6px;width:18px;height:18px;border-radius:50%;border:0;background:var(--df);color:#fff;font-size:12px;line-height:18px;padding:0;cursor:pointer}
.foot{display:grid;grid-template-columns:1fr auto 1.5fr;gap:14px;align-items:end;padding:12px 22px 20px;background:#f7f9fb;border-top:1px dashed #cdd4dc}.yn{display:flex;gap:4px;margin-top:3px}
table.sum{width:100%;border-collapse:collapse;font-size:13px}.sum th,.sum td{border:1px solid var(--ln);padding:7px 9px;text-align:center}.sum th{background:#f1f4f8}.sum td:first-child,.sum th:first-child{text-align:left}.sum tr.t td{font-weight:700;background:#fff4e6}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:14px}textarea{min-height:90px;resize:vertical}.rec{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}.rec .o.sel{background:var(--navy);border-color:var(--navy);color:#fff;box-shadow:0 0 0 2px #12263f25}.rec .o{height:auto;min-height:34px;padding:6px 12px}
.note{font-size:12px;color:var(--mut);padding:0 22px 22px}.pdfwrap{position:fixed;left:0;top:0;z-index:-1;width:794px;background:#fff}
@media(max-width:760px){.colh{display:none}.row{grid-template-columns:30px 1fr;padding:9px 14px}.row .opts,.row .ow{grid-column:1/-1}.foot,.cols2{grid-template-columns:1fr}.sec h2,.pad{padding-left:14px;padding-right:14px}.hero{padding:18px 14px}.foot{padding:12px 14px}.note{padding:0 14px 18px}.trust{margin-left:40%}.opts{flex-wrap:wrap}}
.pdf{box-shadow:none;border-radius:0;margin:0;max-width:none;font-size:11px}.pdf .hero{padding:14px}.pdf .hero h1{font-size:17px}.pdf .logo{height:66px}.pdf .hero{gap:14px;flex-wrap:nowrap}.pdf .pad{padding:12px 14px}.pdf .colh,.pdf .row{grid-template-columns:28px 1fr 150px 1fr!important;padding:4px 14px}.pdf .row .opts,.pdf .row .ow{grid-column:auto!important}.pdf .colh{display:grid!important}
.pdf .hinfo{min-width:0}.pdf .trust{font-size:8px;margin:0 0 3px 64%}.pdf .addr{font-size:10px;margin-top:6px}.pdf .tel{font-size:10px;margin-top:4px}.pdf .hero p{font-size:9px;margin-top:6px}
.pdf .cam,.pdf .ph .x{display:none!important}.pdf .ph img{height:70px}
.pdfpage{width:794px;background:#fff}.pdf .row{background:#fff}.pdf .row.alt{background:#fafbfd}
.pdf .o{min-width:32px;height:22px;font-size:10px}.pdf .sec h2{padding:7px 14px;font-size:12px}.pdf .foot{grid-template-columns:1fr auto 1.5fr!important;padding:8px 14px;align-items:start}.pdf .cols2{grid-template-columns:1fr 1fr!important}
.val{margin-top:3px;min-height:20px;border-bottom:1px solid #9aa5b1;padding:2px 3px;font-size:12px;white-space:pre-wrap;word-break:break-word}.pdf .row .val{margin:0;font-size:10px;min-height:16px}.pdf .grid{grid-template-columns:1fr 1fr 1fr!important;align-items:end}
</style></head><body>

<input type="file" id="inCamera" class="vh" accept="image/*" capture="environment"><input type="file" id="inGallery" class="vh" accept="image/*" multiple>
